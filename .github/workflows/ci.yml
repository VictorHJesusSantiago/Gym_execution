name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar ferramentas de qualidade
        run: pip install ruff==0.6.9 pytest-cov==5.0.0 pip-audit==2.7.3

      - name: Lint (ruff)
        run: ruff check .

      - name: Rodar testes com gate de cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Auditar dependências (CVEs conhecidas)
        run: pip-audit -r requirements.txt --strict

  app-tests:
    name: App (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências (respeita o lockfile)
        run: npm ci

      - name: Checagem de tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Rodar testes com gate de cobertura
        run: npm run test:coverage -- --ci

      - name: Auditar dependências (CVEs conhecidas)
        run: npm audit --audit-level=high

  backend-integration-tests:
    name: Backend (integração — Postgres real)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_execution_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes de integração
        run: pytest -m integration
        env:
          RUN_INTEGRATION_TESTS: "1"
          INTEGRATION_DATABASE_URL: postgresql+psycopg2://gym:gym@localhost:5432/gym_execution_test


  build-and-push-backend-image:
    name: Build & publicar imagem da API
    needs: backend-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy-backend:
    name: Deploy da API
    needs: build-and-push-backend-image
    runs-on: ubuntu-latest
    steps:
      - name: Acionar deploy no provedor escolhido
        run: |
          # TODO: nenhum provedor de hospedagem foi escolhido/contratado ainda
          # (ver README.md raiz, seção "Deploy" — Railway/Render/Fly.io). Quando
          # houver conta + secrets configurados, substituir este passo pela
          # action/CLI do provedor, ex.: 'flyctl deploy --image ghcr.io/...'.
          # Credenciais via secrets do repositório, nunca hardcoded.
          echo "Nenhum provedor configurado — job placeholder (ver README.md raiz, seção Deploy)."

  build-app-web:
    name: Build estático do app (web)
    needs: app-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npx expo export --platform web

      - name: Publicar em hospedagem estática
        run: |
          # TODO: nenhuma hospedagem estática foi escolhida/contratada ainda
          # (Cloudflare Pages/Netlify/Vercel). Substituir por essa action.
          echo "Nenhuma hospedagem estática configurada — job placeholder (ver README.md raiz, seção Deploy)."
