name: CI

# Roda a suíte de testes do backend (pytest, ver backend/tests/) e do app
# (jest, ver app/src/**/__tests__/) a cada push/PR — fecha o ciclo aberto
# pelos testes recém-criados (eles existiam mas não rodavam automaticamente).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cuidado com supply-chain: usamos só actions oficiais do GitHub
# (actions/*), fixadas por versão principal. Para hardening adicional,
# considere fixar por commit SHA completo (ver
# https://docs.github.com/actions/security-guides/security-hardening-for-github-actions).
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest

  app-tests:
    name: App (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências (respeita o lockfile)
        run: npm ci

      - name: Rodar testes
        run: npm test -- --ci
