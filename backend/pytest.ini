[pytest]
# Roda a partir de `backend/` (`pytest`). `rootdir` aqui garante que `app` e
# `tests` sejam resolvidos como pacotes de primeiro nível, sem precisar
# instalar o projeto (`pip install -e .`) ou mexer em PYTHONPATH manualmente.
testpaths = tests
addopts = -ra
markers =
    integration: requer um Postgres real rodando (RUN_INTEGRATION_TESTS=1) — ver README.md "Testes", normalmente pulado
